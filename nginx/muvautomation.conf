# Parte 2 - Lab 3 (Secure Product Challenge): virtual host fortalecido.
# Parte 1 publicaba solo HTTP :80 sin headers ni limites (ver INFORME.md).
# Ahora: HTTPS en :443 (TLS 1.3/1.2), :80 solo redirige, headers de seguridad,
# server_tokens off, rate limit, limite de tamano y bloqueo de rutas internas.
# Este archivo se incluye dentro del bloque http {} de /etc/nginx/nginx.conf,
# por eso limit_req_zone puede ir aqui arriba.

limit_req_zone $binary_remote_addr zone=muv_api:10m rate=10r/s;
# Login y renovacion: verificar Argon2 es costoso A PROPOSITO (memoria y CPU); sin un limite propio
# seria una via para agotar el servidor. La clave vacia (resto de rutas) no se limita.
map $uri $muv_auth_key {
    ~^/auth/(login|refresh)$ $binary_remote_addr;
    default "";
}
limit_req_zone $muv_auth_key zone=muv_auth:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=muv_conn:10m;
# Etapa G: los archivos estaticos del frontend tienen su propio limite. Cargar la consola (4 archivos)
# no consume el de la API (muv_api), y un abuso de los estaticos no deja sin API a nadie.
limit_req_zone $binary_remote_addr zone=muv_static:10m rate=20r/s;
# Exceso de conexiones o de tasa responde 429 (y no 503): queda en la regla R2 de detect.py.
limit_conn_status 429;
# error (no warn): error_log del paquete registra desde el nivel error, y con warn los rechazos del
# limite no quedaban en error.log. Ahi se ve QUE zona (muv_api o muv_auth) rechazo la peticion.
limit_req_log_level error;

# "combined" + rid=<request_id>: el mismo identificador viaja a la app (X-Request-ID) y queda en
# actions.log, de modo que una solicitud se correlaciona entre Nginx y la aplicacion sin adivinar
# por IP + hora. scripts/detect.py lo extrae y lo muestra en cada senal.
log_format muv_combined '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'rid=$request_id';

# :80 solo redirige a HTTPS (sin proxy a la app).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log muv_combined;

    # Destino fijo: con $host, un cliente podia forzar redirecciones a un dominio ajeno
    # (Host header injection / open redirect). Cambiar si cambia la IP del servidor.
    return 301 https://192.168.61.129$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log muv_combined;

    # Certificado autofirmado del laboratorio (SAN IP:192.168.61.129), ver INFORME_PARTE2.md.
    ssl_certificate     /etc/ssl/certs/lab3-server.crt;
    ssl_certificate_key /etc/ssl/private/lab3-server.key;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MuvSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # form-action y base-uri no heredan de default-src: sin ellas la CSP no las restringe (ZAP 10055).
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-store" always;
    # El cliente puede citar este valor al reportar un problema; coincide con rid= en access.log.
    add_header X-Request-ID $request_id always;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;
    autoindex off;
    large_client_header_buffers 4 8k;
    limit_conn muv_conn 20;

    # WAF ModSecurity v3 + OWASP CRS (nginx/modsecurity/waf.conf) para TODO el server :443: API, / y el
    # frontend. Inclusion con comodin: si harden-host.sh no instalo el WAF (o lo revirtio), no hay
    # archivo y el sitio sirve igual, sin WAF.
    include /etc/nginx/fdsi-lab3-waf.d/*.conf;

    # Respuesta de bloqueo (etapa I): cuerpo JSON pequeno y generico, sin decir que regla bloqueo ni
    # que hay un WAF. El mismo 403 cubre el bloqueo del WAF y el de limit_except (metodo no permitido):
    # son indistinguibles a proposito. El X-Request-ID (= rid en access.log) va en las cabeceras del
    # server y permite correlacionar el bloqueo con Nginx, la app y el audit log del WAF.
    error_page 403 = @blocked;
    location @blocked {
        internal;
        default_type application/json;
        return 403 '{"detail":"Request blocked"}';
    }

    # Rutas que no deben publicarse: docs de FastAPI y archivos ocultos (.git, .env, ...).
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    # GET / lleva a la consola del analista: es la unica entrada para personas (la pagina informativa
    # que sirve la app en / no tiene ninguna funcion y queda solo para comprobaciones locales en
    # 127.0.0.1:8000). absolute_redirect off: Location relativa, nunca construida con el Host del cliente.
    location = / {
        absolute_redirect off;
        return 302 /app/;
    }
    location = /app {
        absolute_redirect off;
        return 301 /app/;
    }

    # Etapa G: frontend del analista (frontend/ del repo, instalado en /var/www/fdsi-lab3). Solo
    # archivos estaticos: sin proxy a la API y con su propio limite (muv_static), para que cargar la
    # pagina no consuma el limite de la API. El WAF (nivel server) tambien lo inspecciona.
    # add_header aqui ANULA todas las del server: por eso se repiten todas, con la CSP del frontend.
    location ^~ /app/ {
        alias /var/www/fdsi-lab3/;
        index index.html;
        limit_except GET { deny all; }
        limit_req zone=muv_static burst=40 nodelay;
        limit_req_status 429;
        charset utf-8;
        location ~ /\. {
            return 404;
        }

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        # Estaticos sin datos: se pueden guardar, pero se revalidan siempre (ETag) para que una
        # version nueva llegue al instante. Nada de la API se cachea (no-store en el server).
        add_header Cache-Control "no-cache" always;
        add_header X-Request-ID $request_id always;
    }

    location / {
        # La API solo usa GET y POST.
        limit_except GET POST { deny all; }
        limit_req zone=muv_api burst=20 nodelay;
        limit_req zone=muv_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Host fijo: la app no debe construir URLs absolutas con un Host controlado por el
        # cliente (Host header injection). Cambiar junto con el return 301 de :80 si cambia la IP.
        proxy_set_header Host 192.168.61.129;
        proxy_set_header X-Real-IP $remote_addr;
        # Se sobrescribe (no se anexa): un cliente no puede falsear su IP ante el audit log
        # ni evadir el bloqueo por IP enviando su propio X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Siempre el generado por Nginx: se descarta cualquier X-Request-ID enviado por el cliente.
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 15s;
        # La app tambien envia estas cabeceras (defensa en profundidad si se salta Nginx);
        # se ocultan las del upstream para que la respuesta no lleve cada una duplicada.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
