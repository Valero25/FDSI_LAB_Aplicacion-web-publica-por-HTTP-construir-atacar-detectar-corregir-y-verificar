# Parte 2 - Lab 3 (Secure Product Challenge): virtual host fortalecido.
# Parte 1 publicaba solo HTTP :80 sin headers ni limites (ver INFORME.md).
# Ahora: HTTPS en :443 (TLS 1.3/1.2), :80 solo redirige, headers de seguridad,
# server_tokens off, rate limit, limite de tamano y bloqueo de rutas internas.
# Este archivo se incluye dentro del bloque http {} de /etc/nginx/nginx.conf,
# por eso limit_req_zone puede ir aqui arriba.

limit_req_zone $binary_remote_addr zone=muv_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=muv_conn:10m;

# :80 solo redirige a HTTPS (sin proxy a la app).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Destino fijo: con $host, un cliente podia forzar redirecciones a un dominio ajeno
    # (Host header injection / open redirect). Cambiar si cambia la IP del servidor.
    return 301 https://192.168.61.129$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    # Certificado autofirmado del laboratorio (SAN IP:192.168.61.129), ver INFORME_PARTE2.md.
    ssl_certificate     /etc/ssl/certs/lab3-server.crt;
    ssl_certificate_key /etc/ssl/private/lab3-server.key;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MuvSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    large_client_header_buffers 4 8k;
    limit_conn muv_conn 20;

    # Rutas que no deben publicarse: docs de FastAPI y archivos ocultos (.git, .env, ...).
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    location / {
        # La API solo usa GET y POST.
        limit_except GET POST { deny all; }
        limit_req zone=muv_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se sobrescribe (no se anexa): un cliente no puede falsear su IP ante el audit log
        # ni evadir el bloqueo por IP enviando su propio X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        # La app tambien envia estas cabeceras (defensa en profundidad si se salta Nginx);
        # se ocultan las del upstream para que la respuesta no lleve cada una duplicada.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
