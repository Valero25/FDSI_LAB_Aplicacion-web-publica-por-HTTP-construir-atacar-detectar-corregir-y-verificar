# Exclusiones de CRS que se aplican DESPUES de cargar las reglas (SecRuleRemoveById y
# SecRuleUpdateTarget* necesitan que la regla ya exista).
# En modo DetectionOnly nada se bloquea: aqui solo se quita ruido que haria que el trafico legitimo
# generase eventos (y por tanto senales R7 falsas).

# -- Despliegue ----------------------------------------------------------------------------------------
# 920350 "Host header is a numeric IP address": el laboratorio se publica por IP (https://192.168.61.129,
# certificado con SAN IP, sin DNS) y Nginx fija ese Host. Toda peticion legitima la dispararia.
SecRuleRemoveById 920350

# -- Etapa I: falsos positivos en campos de texto libre de las alertas ------------------------------
# POST /alerts recibe texto que describe ataques reales (p. ej. "powershell -enc", "cmd.exe /c",
# "/etc/passwd", "<script>") en description, technique o tactic. CRS PL1 los marca como ataque
# (ver A17 en risk-register.md). Antes de pasar a SecRuleEngine On, ajustar aqui SOLO esos campos y
# SOLO en esa ruta, con el ID de regla concreto que aparezca en el audit log, por ejemplo:
#
# SecRule REQUEST_FILENAME "@streq /alerts" \
#     "id:1100,phase:1,pass,nolog,t:none,\
#     ctl:ruleRemoveTargetById=932120;ARGS:json.description,\
#     ctl:ruleRemoveTargetById=932120;ARGS:description"
#
# Puede ir en este archivo aunque se cargue despues de CRS: es de fase 1 y los campos del cuerpo JSON
# se inspeccionan en fase 2, asi que el ctl: ya esta activo cuando se evaluan. Se excluye el campo
# con los dos nombres (ARGS:json.x y ARGS:x) hasta confirmar en el audit log cual usa libmodsecurity.
# Nunca quitar una regla para toda la API ni para todos los campos.
