# Exclusiones de CRS que se aplican DESPUES de cargar las reglas (SecRuleRemoveById y ctl:ruleRemoveTarget*
# necesitan que la regla ya exista). SIEMPRE por ruta y campo concretos: nunca una exclusion global.

# -- Despliegue ----------------------------------------------------------------------------------------
# 920350 "Host header is a numeric IP address": el laboratorio se publica por IP (https://192.168.61.129,
# certificado con SAN IP, sin DNS) y Nginx fija ese Host. Toda peticion legitima la dispararia.
SecRuleRemoveById 920350

# -- Etapa I: texto libre de las alertas (un EDR describe ataques reales) -------------------------------
# Un corpus de descripciones legitimas (deploy/waf-corpus/legit-descriptions.txt) disparo, en PL1, estas
# familias en los campos de texto libre: XSS (941xxx: "<img onerror>", "<script>"), SQLi (942xxx:
# "UNION SELECT"), RCE (932xxx: "cmd.exe /c whoami") y LFI (930xxx: "/etc/passwd", rutas de Windows).
# Se quitan SOLO esas cuatro familias y SOLO en esos campos y rutas, por el nombre libmodsecurity
# ARGS:json.<campo> (confirmado en la VM). El resto de reglas y campos sigue inspeccionado.
#
# Rige en fase 2 (cuerpo JSON) aunque la regla sea de fase 1: el ctl: se fija antes de inspeccionar el
# cuerpo. Por familia (ruleRemoveTargetByTag), no por ID, para no perseguir cada ID de SQLi/XSS/etc.

# Solo para POST (chain con REQUEST_METHOD). Se usa ARGS:json.<campo>, no ARGS_POST: libmodsecurity
# 3.0.x pone los argumentos del cuerpo JSON en la coleccion ARGS como "json.<campo>" (confirmado en el
# audit log: "against variable ARGS:json.description"), no en ARGS_POST, asi que ARGS_POST no excluiria
# nada. El prefijo "json." ya acota al cuerpo: un parametro de query string con el mismo nombre es
# ARGS:<campo> (sin prefijo) y sigue inspeccionado.

# POST /alerts: description, technique y tactic (texto libre). hostname NO se excluye: la app lo limita
# a [A-Za-z0-9._-] (no puede llevar la sintaxis de un ataque). severity, source_ip e IDs tampoco.
SecRule REQUEST_METHOD "@streq POST" \
    "id:1100,phase:1,pass,nolog,t:none,chain,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.description,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.description,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.description,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.description,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.technique,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.technique,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.technique,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.technique,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.tactic,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.tactic,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.tactic,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.tactic"
    SecRule REQUEST_FILENAME "@streq /alerts" "t:none"

# POST /alerts/<uuid>/actions: note (texto libre del analista; puede citar lo que vio).
SecRule REQUEST_METHOD "@streq POST" \
    "id:1101,phase:1,pass,nolog,t:none,chain,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.note,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.note,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.note,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.note"
    SecRule REQUEST_FILENAME "@rx ^/alerts/[0-9a-fA-F-]{36}/actions$" "t:none"
