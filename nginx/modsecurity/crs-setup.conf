# Configuracion propia de OWASP CRS 3.3 (en lugar de /etc/modsecurity/crs/crs-setup.conf del paquete):
# asi el comportamiento no depende de lo que traiga ese archivo en cada version de Ubuntu.
# Todo lo que no se fija aqui toma el valor por defecto de REQUEST-901-INITIALIZATION.conf:
# umbrales de anomalia 5 (entrada) y 4 (salida), metodos GET HEAD POST OPTIONS, tipos de contenido
# que incluyen application/json.

# Modo de puntuacion de anomalias (el de CRS 3): cada regla suma y pasa; la decision la toman
# 949110/959100 al superar el umbral. Con SecRuleEngine DetectionOnly esa decision solo se registra.
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Nivel de paranoia 1: el de menos falsos positivos (punto de partida para la etapa I).
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.paranoia_level=1"

# Sin esta variable, la regla 901001 registra en CADA peticion que CRS no esta configurado.
SecAction "id:900990,phase:1,nolog,pass,t:none,setvar:tx.crs_setup_version=338"

# Etapa I: se restringe lo que CRS permite a lo que la API realmente acepta. El resto lo marca la regla
# 920xxx correspondiente (se suma al puntaje de anomalia). Formato de CRS 3.3: valores con |...|.

# Metodos: la API solo usa GET, HEAD y POST (Nginx ya hace limit_except GET POST). Sin OPTIONS, PUT,
# DELETE, etc. (regla 911100).
SecAction "id:900200,phase:1,nolog,pass,t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST'"

# Tipo de contenido: solo application/json (la app responde 415 a cualquier otro, F-1). Sin
# form-urlencoded, multipart ni XML (regla 920420).
SecAction "id:900220,phase:1,nolog,pass,t:none,\
    setvar:'tx.allowed_request_content_type=|application/json|'"

# Content-Type con version 0/9/... no aplica (regla 920440, extensiones de archivo): la API no sirve
# archivos, pero se deja el valor por defecto de CRS para no abrir un hueco por una extension permitida.

# Tamanos: la API acepta cuerpos de 16 KiB (Nginx y SecRequestBodyLimit); un solo argumento no deberia
# superar ese tamano. Se limita la longitud de un valor para que un campo gigante no evada la inspeccion
# por timeout del motor; el texto libre mas largo (description) son 1000 caracteres (ver app/main.py).
SecAction "id:900250,phase:1,nolog,pass,t:none,\
    setvar:'tx.arg_name_length=100',\
    setvar:'tx.arg_length=4000'"
