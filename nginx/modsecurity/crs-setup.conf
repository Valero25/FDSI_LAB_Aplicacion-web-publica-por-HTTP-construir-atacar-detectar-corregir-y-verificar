# Configuracion propia de OWASP CRS 3.3 (en lugar de /etc/modsecurity/crs/crs-setup.conf del paquete):
# asi el comportamiento no depende de lo que traiga ese archivo en cada version de Ubuntu.
# Todo lo que no se fija aqui toma el valor por defecto de REQUEST-901-INITIALIZATION.conf:
# umbrales de anomalia 5 (entrada) y 4 (salida), metodos GET HEAD POST OPTIONS, tipos de contenido
# que incluyen application/json.

# Modo de puntuacion de anomalias (el de CRS 3): cada regla suma y pasa; la decision la toman
# 949110/959100 al superar el umbral. Con SecRuleEngine DetectionOnly esa decision solo se registra.
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Nivel de paranoia 1: el de menos falsos positivos (punto de partida para la etapa I).
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.paranoia_level=1"

# Sin esta variable, la regla 901001 registra en CADA peticion que CRS no esta configurado.
SecAction "id:900990,phase:1,nolog,pass,t:none,setvar:tx.crs_setup_version=338"
