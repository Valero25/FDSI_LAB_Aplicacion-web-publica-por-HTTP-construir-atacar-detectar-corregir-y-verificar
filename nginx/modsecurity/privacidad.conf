# Privacidad del registro de auditoria del WAF (OBLIGATORIO). Se carga ANTES de CRS.
#
# El audit log no lleva cabeceras ni cuerpo de la peticion (SecAuditLogParts AHZ), pero la parte H si
# lleva, por cada regla que coincide, el texto de la coincidencia ("Matched Data: ... found within
# ARGS:x", y en libmodsecurity el valor de la variable). Si CRS inspeccionara un secreto y una regla
# coincidiera con el, el secreto acabaria en el log. Por eso estos campos NO se inspeccionan:
#
# - password, otp, refresh_token en /auth/login, /auth/refresh y /auth/logout: no van a SQL (consultas
#   parametrizadas), no se reflejan en ninguna respuesta ni se escriben en logs; solo se pasan a
#   Argon2 (password), a la comparacion TOTP en tiempo constante (otp, que la app exige de 6 digitos)
#   o al hash SHA-256 que se busca en la base (refresh_token). Inspeccionarlos no detecta ningun ataque
#   contra la aplicacion y si expone el secreto.
# - Cabeceras con credenciales en todas las rutas: Authorization (token de acceso), X-API-Key (emisor),
#   X-Analyst-Key (clave estatica), Cookie y Proxy-Authorization.
#
# Detalles de libmodsecurity v3:
# - La exclusion compara el nombre exacto de la variable. Los argumentos JSON se nombran "json.campo"
#   (o "campo", segun la version): se excluyen las dos formas.
# - Los nombres de cabecera llegan como los envia el cliente; con HTTP/2 siempre en minusculas. Se
#   excluyen la forma canonica y la minuscula (riesgo residual: un cliente que use otra capitalizacion).
# - REQUEST_BODY (el cuerpo como texto) tambien se excluye en las rutas de autenticacion.

SecRule REQUEST_FILENAME "@rx ^/auth/(?:login|refresh|logout)$" \
    "id:1001,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:otp,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.otp,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:refresh_token,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.refresh_token,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_BODY"

SecAction \
    "id:1002,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:Authorization,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:authorization,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:Proxy-Authorization,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:proxy-authorization,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:X-API-Key,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:x-api-key,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:X-Analyst-Key,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:x-analyst-key,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:Cookie,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:cookie"
