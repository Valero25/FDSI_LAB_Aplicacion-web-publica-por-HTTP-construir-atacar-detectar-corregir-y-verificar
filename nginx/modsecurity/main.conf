# Archivo de reglas que carga Nginx (modsecurity_rules_file). El orden importa:
#   1. motor (modo, cuerpo JSON, limites, registro de auditoria)
#   2. configuracion de CRS (paranoia 1, version)
#   3. privacidad: secretos que CRS no inspecciona (antes de las reglas, para que valga en la fase 1)
#   4. reglas de OWASP CRS del paquete modsecurity-crs
#   5. exclusiones que necesitan que las reglas ya existan
# CRS: ruta del paquete de Ubuntu; harden-host.sh comprueba que exista antes de activar el WAF.
Include /etc/nginx/fdsi-lab3-modsecurity/modsecurity.conf
Include /etc/nginx/fdsi-lab3-modsecurity/crs-setup.conf
Include /etc/nginx/fdsi-lab3-modsecurity/privacidad.conf
Include /usr/share/modsecurity-crs/rules/*.conf
Include /etc/nginx/fdsi-lab3-modsecurity/exclusiones.conf
