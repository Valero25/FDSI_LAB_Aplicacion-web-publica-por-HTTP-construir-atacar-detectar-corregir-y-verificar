# Etapa F: motor de ModSecurity v3 (libmodsecurity) para el server :443 del sitio fdsi-lab3.
# Basado en modsecurity.conf-recommended de libmodsecurity 3.0.x, ajustado a esta API (solo JSON,
# cuerpos de 16 KiB) y a la regla de privacidad del registro de auditoria (ver privacidad.conf).
# harden-host.sh lo instala en /etc/nginx/fdsi-lab3-modsecurity/modsecurity.conf.

# -- Motor -------------------------------------------------------------------------------------------
# SOLO DETECCION: las reglas se evaluan y se registran, pero nunca se bloquea una peticion. Se pasara a
# "On" cuando la etapa I haya ajustado los falsos positivos de los campos de texto libre de las alertas.
SecRuleEngine DetectionOnly

# -- Cuerpo de la peticion ---------------------------------------------------------------------------
SecRequestBodyAccess On

# La API solo recibe JSON: se analiza como JSON para que CRS vea cada campo como un argumento (ARGS).
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
# XML no lo acepta la API, pero se analiza igual que en el recomendado para que no pase sin inspeccion.
SecRule REQUEST_HEADERS:Content-Type "@rx ^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"

# Limites coherentes con Nginx (client_max_body_size 16k): Nginx ya responde 413 antes de que el cuerpo
# llegue aqui; estos valores solo evitan que el WAF reserve mas memoria de la que la API acepta.
SecRequestBodyLimit 16384
SecRequestBodyNoFilesLimit 16384
SecRequestBodyInMemoryLimit 16384
SecRequestBodyLimitAction Reject
# Un cuerpo JSON con miles de claves no es una alerta legitima (la API acepta 6 campos).
SecArgumentsLimit 1000
SecRule &ARGS "@ge 1000" \
    "id:200007,phase:2,t:none,log,deny,status:400,severity:2,\
    msg:'Failed to fully parse request body due to large argument count'"

# Cuerpo que no se pudo analizar (JSON roto). A diferencia del recomendado, SIN logdata: el mensaje del
# analizador JSON copia un fragmento del cuerpo, y en /auth/login ese fragmento puede ser la contrasena.
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,severity:2,msg:'Failed to parse request body'"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:200003,phase:2,t:none,log,deny,status:400,severity:2,msg:'Multipart request body failed strict validation'"
SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" \
    "id:200004,phase:2,t:none,log,deny,severity:2,msg:'Multipart parser detected a possible unmatched boundary'"

# -- Respuesta ---------------------------------------------------------------------------------------
# Off: las respuestas de /auth/login y /auth/refresh llevan tokens; el WAF no debe leerlas ni registrarlas.
SecResponseBodyAccess Off

# -- Registro de auditoria ---------------------------------------------------------------------------
# RelevantOnly: solo transacciones con alguna regla que coincida (o un 5xx). Los 4xx NO se registran:
# ya estan en access.log y los cuentan R1-R3; registrarlos aqui pondria cada login fallido en este log.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^5"
# Partes: A (cabecera: fecha, IP, id), H (mensajes de las reglas), Z (fin). Sin B (cabeceras de la
# peticion: Authorization, X-API-Key, X-Analyst-Key, Cookie), sin C/I/J (cuerpo: contrasena, TOTP,
# refresh_token) y sin E/F (respuesta: tokens emitidos).
SecAuditLogParts AHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/modsecurity/audit.json

SecDebugLogLevel 0
SecArgumentSeparator &
SecCookieFormat 0
