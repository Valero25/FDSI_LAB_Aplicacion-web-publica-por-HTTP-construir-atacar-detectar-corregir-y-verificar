# Activa el WAF en el server :443 del sitio (se incluye desde nginx/muvautomation.conf).
# harden-host.sh lo instala en /etc/nginx/fdsi-lab3-waf.d/waf.conf solo si el modulo y las reglas CRS
# estan presentes y nginx -t lo acepta; si no, ese directorio queda vacio y el sitio sirve sin WAF.
modsecurity on;
modsecurity_rules_file /etc/nginx/fdsi-lab3-modsecurity/main.conf;
# El id de cada transaccion del WAF es el mismo $request_id que aparece como rid= en access.log y como
# request_id en actions.log: un evento del WAF se correlaciona con ambos logs.
modsecurity_transaction_id "$request_id";
