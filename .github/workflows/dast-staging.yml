# Laboratorio FSI, paso 5: DAST PASIVO (OWASP ZAP baseline). Solo arana y observa respuestas: no
# envia ataques. Se ejecuta a mano (workflow_dispatch).
#
# Objetivo:
#   - Si la variable del repositorio STAGING_URL existe, se analiza esa URL. Debe ser un sistema
#     PROPIO y AUTORIZADO, alcanzable desde los runners de GitHub.
#   - Si no existe (la VM del laboratorio esta en una red NAT privada, 192.168.61.0/24, que GitHub
#     no alcanza), se levanta en el runner el staging aislado de deploy/staging-local (Nginx del repo
#     + API, HTTPS autofirmado, datos y claves ficticias) y se analiza https://localhost:8443/app/.
# Resultado: artefacto "informe-zap" (HTML, JSON y Markdown).
name: DAST staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline (pasivo)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
      # zaproxy/zaproxy 2.17.0 (stable)
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Staging local aislado (sin STAGING_URL)
        if: env.STAGING_URL == ''
        run: |
          docker build -f deploy/staging-local/Dockerfile -t fdsi-staging .
          docker run -d --name staging -p 127.0.0.1:8443:443 fdsi-staging
          for _ in $(seq 30); do curl -sfk -o /dev/null https://127.0.0.1:8443/app/ && break; sleep 1; done
          curl -skI https://127.0.0.1:8443/app/
          echo "TARGET=https://localhost:8443/app/" >> "$GITHUB_ENV"

      - name: Staging remoto (STAGING_URL)
        if: env.STAGING_URL != ''
        run: echo "TARGET=$STAGING_URL" >> "$GITHUB_ENV"

      # -I: las advertencias no fallan el job (el informe es la evidencia; la revision es manual).
      - name: ZAP baseline
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$TARGET" -r informe-zap.html -J informe-zap.json -w informe-zap.md -I
          cat zap/informe-zap.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: informe-zap
          path: zap/
          retention-days: 30
