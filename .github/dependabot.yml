# Mantiene al dia los SHA de commit con los que se fijan las acciones de .github/workflows/
# (abre un PR con el SHA nuevo y su comentario de version).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Cadena de suministro: una version recien publicada no se propone hasta pasados 7 dias. Si una
    # accion se compromete y publica una version maliciosa, suele detectarse y retirarse antes.
    cooldown:
      default-days: 7

  # SCA de Python: dependencias de produccion (app/requirements.txt). Las alertas de seguridad
  # (Dependabot alerts / security updates) no esperan al cooldown; solo las actualizaciones de version.
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Dependencias de desarrollo y CI (requirements-dev.txt en la raiz).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
