# Mantiene al dia los SHA de commit con los que se fijan las acciones de .github/workflows/
# (abre un PR con el SHA nuevo y su comentario de version).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Cadena de suministro: una version recien publicada no se propone hasta pasados 7 dias. Si una
    # accion se compromete y publica una version maliciosa, suele detectarse y retirarse antes.
    cooldown:
      default-days: 7
