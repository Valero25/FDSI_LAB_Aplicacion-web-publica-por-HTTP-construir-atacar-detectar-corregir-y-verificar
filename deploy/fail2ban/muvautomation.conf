# Instalar: sudo install -m 644 deploy/fail2ban/muvautomation.conf /etc/fail2ban/filter.d/muvautomation.conf
# Cuenta intentos con clave invalida o ya bloqueados en el audit log de la app (JSON por linea).
# client_ip es la IP real: Nginx sobrescribe X-Forwarded-For con $remote_addr.
[Definition]
failregex = ^.*"client_ip": "<HOST>".*"result": "(unauthorized|locked_out)"
ignoreregex =
