# Instalar: sudo install -m 644 deploy/fail2ban/modsecurity.conf /etc/fail2ban/filter.d/fdsi-modsecurity.conf
# Cuenta transacciones que el WAF BLOQUEO (http_code 403 en el audit log; CRS marca sus reglas
# noauditlog, asi que el bloqueo se registra por estado). Del audit log JSON (una linea por transaccion)
# solo se leen la IP del cliente y el codigo de respuesta; nada del cuerpo ni de las cabeceras (coherente
# con SecAuditLogParts AHZ y privacidad.conf). Un 403 en el audit log siempre es un bloqueo: un 403 de
# limit_except por metodo raro tambien es trafico de ataque, y el analista nunca usa esos metodos.
# client_ip es la IP real (Nginx sobrescribe X-Forwarded-For con $remote_addr) y aparece antes que la
# seccion response en la linea JSON.
[Definition]
failregex = ^.*"client_ip":\s*"<HOST>".*"http_code":\s*403
ignoreregex =
# El audit log no trae marca de tiempo propia de syslog: se toma la de la transaccion (time_stamp).
datepattern = "time_stamp":\s*"%%a %%b %%d %%H:%%M:%%S %%Y"
