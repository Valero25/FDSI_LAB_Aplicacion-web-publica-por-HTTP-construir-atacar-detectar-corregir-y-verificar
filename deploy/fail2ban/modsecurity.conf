# Instalar: sudo install -m 644 deploy/fail2ban/modsecurity.conf /etc/fail2ban/filter.d/fdsi-modsecurity.conf
# Cuenta los BLOQUEOS del WAF en el error.log de Nginx: la linea "ModSecurity: Access denied with code 403"
# solo la escribe ModSecurity cuando deniega (regla 949110). Un 403 de la aplicacion (denegacion por rol)
# NO aparece aqui, asi que un analista no se veta por usar mal sus permisos. La IP real es la del
# [client <IP>] que registra ModSecurity (Nginx sobrescribe X-Forwarded-For con $remote_addr).
[Definition]
failregex = ^.*\[client <HOST>\] ModSecurity: Access denied with code 403
ignoreregex =
# Marca de tiempo al inicio de la linea del error.log de Nginx: 2026/10/14 20:31:15
datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
