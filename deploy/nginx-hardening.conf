# Instalar: sudo install -D -m 644 deploy/nginx-hardening.conf /etc/systemd/system/nginx.service.d/hardening.conf
# Drop-in de systemd para el servicio nginx del paquete de Ubuntu. harden-host.sh lo instala
# con reversion automatica si nginx no vuelve a levantar.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
