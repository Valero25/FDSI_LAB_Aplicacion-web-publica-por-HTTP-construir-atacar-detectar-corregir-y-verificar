# Instalar: sudo install -m 644 deploy/sshd-hardening.conf /etc/ssh/sshd_config.d/99-lab3.conf
# Validar SIEMPRE con `sudo sshd -t` antes de recargar, y probar la llave desde otra terminal.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
