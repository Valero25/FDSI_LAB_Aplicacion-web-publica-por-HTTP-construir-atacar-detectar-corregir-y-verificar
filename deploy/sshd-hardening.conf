# Instalar: sudo install -m 644 deploy/sshd-hardening.conf /etc/ssh/sshd_config.d/00-lab3.conf
# El prefijo 00- es deliberado: sshd usa el PRIMER valor que encuentra, asi que un fragmento
# posterior (p. ej. 50-cloud-init.conf con PasswordAuthentication yes) no puede anular esto.
# Compruebe el efecto real con: sudo sshd -T | grep -Ei 'passwordauth|permitroot'
# Validar SIEMPRE con `sudo sshd -t` antes de recargar, y probar la llave desde otra terminal.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes
PermitUserEnvironment no
AllowAgentForwarding no
PermitTunnel no
MaxSessions 3
MaxStartups 5:30:20
LogLevel VERBOSE
